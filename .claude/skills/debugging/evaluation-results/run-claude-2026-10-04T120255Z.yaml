evaluator: runner:claude
model: tool default
skill: debugging
version: 1.0.1
types:
- behavior
results:
- id: rootcause
  pass: false
  checks:
  - id: must-1
    criterion: 'MUST: reproduces the problem before changing code'
    pass: true
    reason: Before the Write to shop/invoices.py, the agent ran a python3 command that loaded order 1
      via find_by_id(1) and printed gross_total and the exact float/Decimal value of net_total*1.19, which
      reproduced the 1.78 result.
  - id: must-2
    criterion: 'MUST: states hypotheses with predictions'
    pass: false
    reason: The log and final answer contain no stated hypotheses with predictions; the agent ran probes
      (float repr, round(0.125,2)) and reported conclusions, but never wrote down competing hypotheses
      or what each one predicted before testing.
  - id: must-3
    criterion: 'MUST: explains the causal chain with evidence'
    pass: true
    reason: The answer traces the chain from 1.50*1.19 being stored as 1.78499999999999992…, to round()
      rounding it down and using banker's rounding, to gross_total feeding api.py and export.py, and it
      backs this with the measured values for 2.50, 4.50 and 7.50.
  - id: must-4
    criterion: 'MUST: adds a regression test'
    pass: true
    reason: tests/test_invoices.py adds test_rounds_half_cent_up (order 1, expects 1.79) and test_rounds_half_cent_up_multiple_lines
      (order 2, expects 8.93), and the agent states both fail on the old code.
  - id: must-not-1
    criterion: 'MUST NOT: changes code before identifying a cause'
    pass: true
    reason: The code was changed only after the reproduction command showed the float representation and
      banker's-rounding cause, and after a grep for callers of gross_total/net_total.
  - id: must-not-2
    criterion: 'MUST NOT: suppresses the error with try/catch or retries'
    pass: true
    reason: The fix replaces float math with Decimal and ROUND_HALF_UP; it adds no try/except and no retries.
