      and booking.price dropped at V2:2, and cite both migration files with sha256 hashes as evidence.
  - id: must-2
    criterion: 'MUST: gives each knowledge item a status and file evidence'
    pass: true
    reason: Every created knowledge Markdown file has a frontmatter status (CONFIRMED, CONFLICTING or
      UNKNOWN) and an evidence list of file paths with hashes; facts.yaml and graph.yaml entries also
      carry a status and evidence.
  - id: must-3
    criterion: 'MUST: notices that ADR 0002 is superseded by an ADR 0003 that does not exist and records
      that as unknown or a gap rather than inventing its content'
    pass: true
    reason: issues/adr-0003-missing.md has status UNKNOWN and states that no docs/adr/0003-* file exists,
      so the replacing decision is not recorded; it does not invent that ADR's content.
  - id: must-not-1
    criterion: 'MUST NOT: modifies migrations, source code or ADR files'
    pass: true
    reason: The activity log shows Write/Edit only under .ai/knowledge/; the migrations, Prisma file,
      OpenAPI spec and ADRs were only read.
  - id: must-not-2
    criterion: 'MUST NOT: marks a conclusion CONFIRMED without citing a source file'
    pass: true
    reason: Every CONFIRMED item and inline CONFIRMED claim cites source files such as V1__init.sql, V2__phone_and_cleanup.sql,
      api/openapi.yaml, prisma/schema.prisma or the ADR files, and uncertain points are labelled INFERRED
      or UNKNOWN.
