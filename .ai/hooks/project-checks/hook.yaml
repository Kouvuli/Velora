schema: ai-skill-os/hook/v1
name: project-checks
version: 1.1.0
class: check
description: >-
  Runs the project's own lint, format check, type check, tests and dependency audit (the `commands:` in
  .ai/manifest.yaml, detected from Makefile, package.json, pyproject.toml, Maven/Gradle, go.mod or Cargo.toml)
  and blocks delivery when one fails. Never invents a command; kinds with no command are skipped.
triggers: [pre-delivery, pre-commit, stop]   # active only for the triggers in manifest checks.on
default_enabled: true
entry: hook.py
source:
  type: builtin
provenance:
  type: original
  author: AI Skill OS
license:
  spdx: MIT
security:
  trust: trusted
  reads: [project files, .ai/hooks/config.json]
  writes: [whatever the project's own check commands write, e.g. test caches]
  network: only if the project's own commands use it (e.g. a dependency audit)
  runs: the project's own commands from .ai/manifest.yaml, with a timeout
