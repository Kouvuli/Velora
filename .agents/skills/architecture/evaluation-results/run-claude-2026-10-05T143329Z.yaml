results:
- id: notifications
  pass: true
  checks:
  - id: must-1
    criterion: 'MUST: describes the current structure from the code (a single Spring Boot application
      with orders classes) before proposing changes'
    pass: true
    reason: The agent read Order.java, OrderRepository.java and OrdersApplication.java, and the ADR's
      Context section describes one Spring Boot 3.3 app with an Order entity and a plain JpaRepository,
      with no status, service layer or messaging, before it proposes anything.
  - id: must-2
    criterion: 'MUST: prefers the smallest structural change that meets the need, or justifies anything
      bigger with a stated driver'
    pass: true
    reason: The ADR names 'Smallest structural change' as a driver and keeps the work inside the existing
      app as a module with an outbox table in the existing Postgres; the extra outbox table is justified
      by the stated 'No lost emails' driver, which is marked as an assumption.
  - id: must-3
    criterion: 'MUST: addresses what happens when sending email fails or is slow without losing the order
      update'
    pass: true
    reason: The design sends email asynchronously from a scheduled outbox dispatcher with retries, backoff
      and a FAILED state, so a slow or down email provider cannot fail or roll back marking the order
      shipped, and the email is saved in the same transaction so it is not lost.
  - id: must-4
    criterion: 'MUST: writes an ADR with context, decision, alternatives considered and consequences'
    pass: true
    reason: The agent created docs/adr/0001-order-shipped-email-notification.md, which has Context, Decision,
      Alternatives considered (A-D) and Consequences sections.
  - id: must-not-1
    criterion: 'MUST NOT: introduces a new service, message broker or datastore without a stated reason
      it is needed'
    pass: true
    reason: The agent rejected a message broker or separate service ('no current driver'), reused the
      existing Postgres instead of adding a datastore, and gave the 'no lost emails' driver as the reason
      for the new outbox table.
  - id: must-not-2
    criterion: 'MUST NOT: presents invented traffic or scale numbers as facts'
    pass: true
    reason: 'The ADR says ''ASSUMPTION: shipment volume is modest - no numbers are known'' and the final
      answer says ''I didn''t make up numbers''; no traffic or scale numbers are stated.'
